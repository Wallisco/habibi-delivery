name: Deploy dispatch service

on:
  push:
    branches: [main]
    paths: ['dispatch-service/**']
  workflow_dispatch:

# Staging first (Keychat's integration environment, simulated drivers), then
# production. Production runs only when CI has passed on this same commit and
# staging passed its health check; otherwise production is not touched.
jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  staging:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy staging over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            if [ ! -d /opt/dispatch-staging/.git ]; then
              echo "staging not set up yet (deploy/add-staging.sh); skipping"; exit 0
            fi
            cd /opt/dispatch-staging
            sudo -u dispatch git fetch --all
            sudo -u dispatch git reset --hard origin/main
            cd dispatch-service
            sudo -u dispatch npm ci --omit=dev || sudo -u dispatch npm install --omit=dev
            sudo systemctl restart dispatch-staging
            sleep 3
            curl -fsS http://127.0.0.1:3001/health | grep -q '"env":"staging"' \
              || (sudo journalctl -u dispatch-staging -n 40 && exit 1)
            echo "staging deployed"

  production:
    needs: [ci, staging]
    # Only from main: a manual run started on a branch must not reach production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy production over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            cd /opt/dispatch
            git fetch --all
            # The commit CI tested, not whatever main points at by now.
            git reset --hard ${{ github.sha }}
            cd dispatch-service
            npm ci --omit=dev || npm install --omit=dev
            # Back up the database before restarting. Cheap insurance.
            sudo -u dispatch cp /var/lib/dispatch/dispatch.db \
              /var/lib/dispatch/backups/pre-deploy-$(date +%F-%H%M).db || true
            sudo systemctl restart dispatch
            sleep 3
            curl -fsS http://127.0.0.1:3000/health | grep -q '"env":"production"' \
              || (sudo journalctl -u dispatch -n 40 && exit 1)
            echo "deployed"
